# CI: build + test on every push and pull request.
#
# Runs the cross-compiler + QEMU smoke suite (smoke-ftp, smoke-sdk,
# smoke-linux, smoke-linux-mmap, cmd/test all 15/15) on x86 GitHub
# runners.  No AWS secrets required.
#
# AMI deployment lives in deploy.yml and is gated on pushes to main
# only.  Splitting the workflows gives two distinct status badges so
# CI health and deployment health are immediately distinguishable.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build + test deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            qemu-system-arm \
            qemu-efi-aarch64 \
            parted dosfstools mtools \
            ftp \
            python3

      - name: Build
        run: make -j$(nproc)

      # smoke-ftp + smoke-sdk + smoke-linux + smoke-linux-mmap + cmd/test 15/15
      - name: Test
        run: make test

