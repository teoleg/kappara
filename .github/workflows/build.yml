# kappara CI -- two-stage build:
#
#   build-and-test : runs on every push + PR.  Cross-compiles the
#                    kernel and userland on x86, runs `make test`
#                    (smoke-ftp + smoke-sdk + smoke-linux* + cmd/test
#                    all 15/15) under QEMU TCG.  ZERO AWS secrets
#                    needed.
#
#   ami            : runs only on tagged releases.  Builds the
#                    GPT+ESP raw image (AWS.md stage G), uploads to
#                    S3, imports as an EBS snapshot, registers as
#                    an AMI in the user's AWS account.  Silently
#                    skipped when the AWS_ACCESS_KEY_ID secret
#                    isn't set, so the workflow lands green on
#                    repos without AWS yet.
#
# Required secrets (only for the ami job; set in Settings ->
# Secrets and variables -> Actions):
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION              e.g. us-east-1
#   KAPPARA_S3_BUCKET       bucket the vmimport role can read
#
# The vmimport IAM service role itself is a one-time AWS-side
# setup; see docs/AWS.md.

name: build

on:
  push:
    branches: ['**']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:  # also let you trigger AMI builds manually

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain + smoke-test dependencies.  parted/dosfstools/mtools
      # are only needed by `make ami`, but the AMI job re-checks out
      # and re-installs anyway; including them here lets `make ami`
      # work as a smoke step too if we ever want to gate releases on
      # "image built successfully" without uploading.
      - name: Install build + test deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            qemu-system-arm \
            qemu-efi-aarch64 \
            parted dosfstools mtools \
            ftp \
            python3

      - name: Build
        run: make -j$(nproc)

      # `make test` is the canonical health check: smoke-ftp, smoke-sdk,
      # smoke-linux, smoke-linux-mmap, and cmd/test all 15/15.  Runs
      # under QEMU TCG -- ~90s on GitHub's x86 runner.
      - name: Test
        run: make test

  ami:
    needs: build-and-test
    # Only run on tagged releases AND when AWS secrets are present.
    # Untagged builds and forks without secrets fall through silently
    # so the workflow stays green for everyone.
    if: |
      github.event_name == 'release' &&
      vars.HAS_AWS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            parted dosfstools mtools \
            python3 jq

      - name: Build kernel + AMI image
        run: |
          make -j$(nproc)
          make ami

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Upload AMI to S3 + register
        run: |
          ./tools/upload-ami.sh \
            --bucket "${{ secrets.KAPPARA_S3_BUCKET }}" \
            --name   "kappara-${{ github.ref_name }}"

      # Surface the AMI ID as a release asset comment so it's
      # one click away from the release page.
      - name: Comment on release
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('build/last-ami-id.txt')) return;
            const ami = fs.readFileSync('build/last-ami-id.txt', 'utf8').trim();
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              release_id: context.payload.release.id,
              body: (context.payload.release.body || '') +
                    '\n\nAMI: `' + ami + '`'
            });
